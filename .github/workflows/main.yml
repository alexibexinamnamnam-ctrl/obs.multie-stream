name: Windows Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  windows-build:
    name: Build for Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel

      - name: Install
        run: cmake --install build_x64 --prefix release/RelWithDebInfo --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: obs-multistream-chat-windows
          path: release/RelWithDebInfo
