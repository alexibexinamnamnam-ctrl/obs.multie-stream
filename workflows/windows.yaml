name: Windows Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  windows-build:
    name: Build for Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Package Plugin
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: RelWithDebInfo
          package: true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-multistream-chat-windows
          path: ${{ github.workspace }}/release/obs-multistream-chat-*-windows-x64*.*
